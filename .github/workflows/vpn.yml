name: Sydney TCP VPN
on:
  push:
    branches: [ main ]
  schedule:
    - cron: '0 */5 * * *' # Her 5 saatte bir otomatik yeniden başlatır (kapanmasın diye)
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 350 
    steps:
      - uses: actions/checkout@v3
      
      - name: WireGuard ve TCP Proxy Kurulumu
        run: |
          sudo apt-get update
          sudo apt-get install -y wireguard socat curl

          # Sunucu ayarları
          umask 077
          wg genkey | tee server.key | wg pubkey > server.pub
          SRV_PRIV=$(cat server.key)
          SRV_PUB=$(cat server.pub)

          cat > wg0.conf <<EOF
          [Interface]
          Address = 10.66.66.1/24
          ListenPort = 51820
          PrivateKey = $SRV_PRIV
          PostUp = iptables -A FORWARD -i wg0 -j ACCEPT; iptables -A FORWARD -o wg0 -j ACCEPT; iptables -t nat -A POSTROUTING -o eth0 -j MASQUERADE
          PostDown = iptables -D FORWARD -i wg0 -j ACCEPT; iptables -D FORWARD -o wg0 -j ACCEPT; iptables -t nat -D POSTROUTING -o eth0 -j MASQUERADE
          EOF

          sudo sysctl -w net.ipv4.ip_forward=1
          sudo cp wg0.conf /etc/wireguard/wg0.conf
          sudo wg-quick up wg0
          
          # İstemci ayarları
          wg genkey | tee client.key | wg pubkey > client.pub
          CLI_PRIV=$(cat client.key)
          CLI_PUB=$(cat client.pub)
          
          sudo wg set wg0 peer $CLI_PUB allowed-ips 10.66.66.2/32
          
          # Dış IP'yi al
          IP=$(curl -s ifconfig.me)
          
          cat > iphone.conf <<EOF
          [Interface]
          PrivateKey = $CLI_PRIV
          Address = 10.66.66.2/32
          DNS = 1.1.1.1, 8.8.8.8
          MTU = 1420

          [Peer]
          PublicKey = $SRV_PUB
          Endpoint = $IP:51820
          AllowedIPs = 0.0.0.0/0
          PersistentKeepalive = 25
          EOF

          echo "=== IPHONE CONFIG BURADA (Kopyala) ==="
          cat iphone.conf
          echo "======================================"
          
          # Sunucuyu açık tut
          sleep 340m
